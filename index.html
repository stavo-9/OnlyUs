function markChatRead(name){if(!name)return;let changed=false;(chatMessages[name]||[]).forEach(m=>{if(!m.me&&!m.read){m.read=true;changed=true}});if(changed)save()}
function notificationItems(){const items=[];friendRequests.forEach(r=>items.push({icon:'👥',text:`${r.name} enviou uma solicitação de amizade`,action:`toggleNotificationsBubble();go('friends')`}));if(stories.length)items.push({icon:'📖',text:`${activeStories().length} story(s) disponível(is)`,action:`toggleNotificationsBubble();go('feed')`});return items.slice(0,8)}
function notificationsBubble(){const items=notificationItems();return `<div class="notificationsBubble" onclick="event.stopPropagation()"><div class="settingsBubbleHead">🔔 Notificações</div>${items.length?items.map(i=>`<button onclick="${i.action}">${i.icon}<span>${esc(i.text)}</span></button>`).join(''):`<div class="topChatEmpty">Você não tem novas notificações.</div>`}</div>`}
function layout(content){return `<header class="top"><div class="logo" onclick="go('feed')"><img class="navLogoImg" src="${LOGO}" alt="OnlyUs." onerror="this.style.display='none'"><span class="logoWord">OnlyUs.</span></div><input class="search" placeholder="Pesquisar no OnlyUs." oninput="searchQuery=this.value" onkeydown="if(event.key==='Enter'){searchQuery=this.value;go('search')}"><nav class="nav"><button class="${route==='feed'?'active':''}" onclick="go('feed')">🏠 Início</button><button class="${route==='friends'?'active':''}" onclick="go('friends')">👥 Amigos</button><div class="topChatWrap"><button class="${topChatOpen?'active':''}" onclick="toggleTopChatMenu()" style="position:relative">💬 Bate-papo${chatUnreadBadge()}</button>${topChatOpen?topChatMenu():''}</div><div class="notifWrap"><button class="${notificationsBubbleOpen?'active':route==='notifications'?'active':''}" onclick="toggleNotificationsBubble()">🔔</button>${notificationsBubbleOpen?notificationsBubble():''}</div></nav><div class="actions"><button class="mobileMenuBtn iconBtn" onclick="openMobileMenu()" title="Mais opções">☰</button><button class="iconBtn" onclick="toggleSettingsBubble()" title="Configurações">⚙️</button><button class="avatarBtn" onclick="viewMyProfile()" title="Meu perfil">${user.avatar?`<img src="${user.avatar}" alt="">`:esc(initials())}</button></div></header><main>${content}</main>${chatWidget()}${settingsBubbleOpen?settingsBubble():''}`}
function postComposer(context='feed',targetName=''){const target=targetName?`<div class=\"wallTargetNote\">📌 Publicando no perfil de <b>${esc(targetName)}</b> — a pessoa será marcada automaticamente.</div>`:'';return `<div class=\"card wallPostComposer\">${target}<div class=\"composer\">${avatarHtml()}<textarea id=\"newPost\" placeholder=\"O que você quer compartilhar?\"></textarea>${emojiPicker('newPost','emoji-post')}</div><div id=\"mediaPreview\" class=\"mediaPreview hidden\"></div><div class=\"tagPicker\" id=\"tagPicker\"></div><div class=\"row between\" style=\"margin-top:12px;flex-wrap:wrap\"><div class=\"row\" style=\"flex-wrap:wrap\"><label class=\"btn ghost\">📷 Foto <input type=\"file\" class=\"hidden\" accept=\"image/*\" capture=\"environment\" onchange=\"selectMedia(this,'image')\"></label><label class=\"btn ghost\">🎞️ Vídeo <input type=\"file\" class=\"hidden\" accept=\"video/*\" capture=\"environment\" onchange=\"selectMedia(this,'video')\"></label><label class=\"btn ghost\">🎵 Áudio <input type=\"file\" class=\"hidden\" accept=\"audio/*\" onchange=\"selectMedia(this,'audio')\"></label><label class=\"btn ghost\">🏷️ Marcar <input type=\"button\" class=\"hidden\" onclick=\"openTagPicker()\"></label></div><div class=\"row\"><select id=\"newAudience\" class=\"btn ghost\"><option value=\"public\">🌎 Público</option><option value=\"friends\">👥 Privado — somente amigos</option></select><select id=\"newAlbum\" class=\"btn ghost\"><option value=\"\">Sem álbum</option>${albums.map(a=>`<option value=\"${a.id}\">${esc(a.name)}</option>`).join('')}</select><button class=\"btn primary\" onclick=\"publish('${esc(targetName)}')\">Publicar</button></div></div></div>`}
function activeStories(){const now=Date.now();return stories.filter(st=>now-st.createdAt<86400000)}
const storyReactionMap={like:['👍','Curtir'],love:['💜','Amei'],haha:['😂','Haha'],wow:['😮','Uau'],sad:['😢','Lamentável'],angry:['😡','Raiva']};
function storyReactionCount(st,r){return Object.values(st.reactions||{}).filter(x=>x===r).length}
function storyMyReaction(st){return (st.reactions||{})[user.name]||''}
function storiesStrip(){const ss=activeStories();return `<div class="card"><div class="sectionTitle"><div><h3 style="margin:0">Stories</h3><div class="muted">Texto ou mídia · expiram em 24 horas.</div></div><button class="btn soft" onclick="createStory()">➕ Adicionar story</button></div><div class="storyStrip"><div class="storyCard storyAdd" onclick="createStory()"><span>＋</span><div>Seu story</div></div>${ss.map(st=>`<div class="storyCard" onclick="viewStory(${st.id})">${st.media?`<img src="${st.media.data}" alt="">`:''}${!st.media?`<div class="storyText" style="font-size:17px;padding:12px">${esc(st.text)}</div>`:''}<div class="storyName">${esc(st.owner)} ${st.owner===user.name?'· '+(st.viewers||[]).length+' visualizações':''}</div></div>`).join('')}</div></div>`}
function createStory(){openModal(`<h2>Adicionar story</h2><div class="field"><label>Texto</label><textarea id="storyText" placeholder="Compartilhe algo no seu story..."></textarea></div><div class="field"><label>Mídia (opcional)</label><input id="storyFile" type="file" accept="image/*,video/*" onchange="previewStoryFile(this)"></div><div id="storyPreview" class="mediaPreview hidden"></div><div class="modalActions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="publishStory()">Publicar story</button></div>`)}
let pendingStoryMedia=null;
function previewStoryFile(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingStoryMedia={type:f.type.startsWith('video/')?'video':'image',data:r.result};$('storyPreview').classList.remove('hidden');$('storyPreview').innerHTML=pendingStoryMedia.type==='video'?`<video controls style="max-width:100%;max-height:240px" src="${r.result}"></video>`:`<img style="max-width:100%;max-height:240px" src="${r.result}">`};r.readAsDataURL(f)}
function publishStory(){const text=$('storyText').value.trim();if(!text&&!pendingStoryMedia)return toast('Adicione um texto ou uma mídia.');stories.unshift({id:Date.now(),owner:activeIdentity.name,text,media:pendingStoryMedia,createdAt:Date.now(),reactions:{},comments:[],viewers:[]});pendingStoryMedia=null;save();closeModal();render();toast('Story publicado!')}
function viewStory(id){const st=activeStories().find(x=>x.id===id);if(!st)return;if(st.owner!==user.name&&!(st.viewers||[]).includes(user.name)){st.viewers=[...(st.viewers||[]),user.name];save()}openStoryViewer(st.id)}
function reactStory(id,r){const st=stories.find(x=>x.id===id);if(!st)return;st.reactions=st.reactions||{};st.reactions[user.name]=st.reactions[user.name]===r?'':r;save();openStoryViewer(id)}
function addStoryComment(id){const input=$('story-comment-input-'+id);const text=input?.value.trim();if(!text)return;const st=stories.find(x=>x.id===id);if(!st)return;st.comments=st.comments||[];st.comments.push({id:Date.now(),owner:user.name,text});save();openStoryViewer(id)}
function openStoryViewer(id){const st=activeStories().find(x=>x.id===id);if(!st)return;const mine=st.owner===user.name;const viewers=(st.viewers||[]);const comments=(st.comments||[]);const myR=storyMyReaction(st);$('modalRoot').innerHTML=`<div class="storyViewer" onclick="if(event.target===this)closeStoryViewer()"><div class="storyViewerBox">${st.media?(st.media.type==='video'?`<video controls autoplay src="${st.media.data}"></video>`:`<img src="${st.media.data}" alt="Story">`):`<div class="storyText">${esc(st.text)}</div>`}<div class="storyViewerMeta">${esc(st.owner)}${mine?` · ${viewers.length} visualizações`:''}</div><button class="storyViewerClose" onclick="closeStoryViewer()">×</button>${mine?`<div class="storyOwnerPanel"><b>👁️ Quem visualizou</b>${viewers.length?viewers.map(v=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(v)}</span><span class="muted">visualizou</span></div>`).join(''):'<span class="muted">Ainda ninguém visualizou este story.</span>'}</div>`:`<div class="storyViewerDetails"><button onclick="reactStory(${st.id},'like')" class="${myR==='like'?'active':''}">👍 ${storyReactionCount(st,'like')}</button><button onclick="reactStory(${st.id},'love')" class="${myR==='love'?'active':''}">💜 ${storyReactionCount(st,'love')}</button><button onclick="reactStory(${st.id},'haha')" class="${myR==='haha'?'active':''}">😂 ${storyReactionCount(st,'haha')}</button><input id="story-comment-input-${st.id}" placeholder="Comentar story..." onkeydown="if(event.key==='Enter')addStoryComment(${st.id})"><button onclick="addStoryComment(${st.id})">Enviar</button></div>`}</div>${!mine&&comments.length?`<div style="position:fixed;left:15px;right:15px;bottom:72px;max-height:125px;overflow:auto">${comments.slice(-4).map(c=>`<div style="background:#111b;color:#fff;border-radius:10px;padding:7px 9px;margin:4px 0;font-size:12px"><b>${esc(c.owner)}</b>: ${esc(c.text)}</div>`).join('')}</div>`:''}</div>`}
function closeStoryViewer(){$('modalRoot').innerHTML=''}
function feed(){return layout(`<div class="grid"><aside class="side"><button onclick="go('profile')">👤 ${esc(user.name)}</button><button onclick="go('friends')">👥 Amigos</button><button onclick="go('photos')">🖼️ Fotos</button><button onclick="go('settings')">⚙️ Configurações</button></aside><section>${storiesStrip()}${postComposer('feed')}${posts.map(renderPost).join('')}</section><aside><div class="card"><h3 style="margin-top:0">Seu espaço</h3><p class="muted">Atualize sua foto de perfil ou capa. Cada atualização aparece no feed e no seu perfil até você ocultá-la do perfil.</p><button class="btn soft" style="width:100%" onclick="go('profile')">Abrir meu perfil</button></div><div class="card"><h3 style="margin-top:0">Fotos e álbuns</h3><p class="muted">Fotos, vídeos e GIFs ficam reunidos em Fotos.</p><button class="btn ghost" style="width:100%" onclick="go('photos')">Ver Fotos</button></div></aside></div>`)}
function canSeePost(p){return p.audience==='public'||p.owner===user.name||p.owner===user.username||p.audience==='friends'}
const reactionMap={like:['👍','Like'],love:['💜','Amei'],haha:['😂','Haha'],wow:['😮','Uau'],sad:['😢','Lamentável'],angry:['😡','Raiva'],disgust:['🤢','Nojo']};
function renderPost(p){if(!canSeePost(p))return '';p.reactions=p.reactions||{};const likeCount=Object.values(p.reactions).filter(r=>r==='like').length;const reactionCount=Object.values(p.reactions).filter(Boolean).length;const isMine=p.owner===user.name;const isWallTarget=p.wallTarget===user.name;const isTaggedMe=(p.tagged||[]).includes(user.name);return `<article class="card" id="post-${p.id}"><div class="row"><button class="profileLinkAvatar miniAvatar" onclick="viewFriend('${esc(p.owner)}')" title="Abrir perfil de ${esc(p.owner)}">${isMine?(user.avatar?`<img src="${user.avatar}" alt="">`:esc(initials())):esc((p.initial||p.owner||'U')[0].toUpperCase())}</button><div><button class="profileNameLink" onclick="viewFriend('${esc(p.owner)}')" title="Abrir perfil de ${esc(p.owner)}">${esc(p.owner)}</button><div class="muted">${esc(p.time||'Agora')} · ${p.audience==='friends'?'👥 Somente amigos':'🌎 Público'}${p.wallTarget?` · 📌 no perfil de ${esc(p.wallTarget)}`:''}</div></div>${p.profileUpdate?`<span class="profileUpdateBadge">📸 Atualização de perfil</span>`:''}<div class="postMenu"><button onclick="togglePostMenu(${p.id})">⋯</button><div class="postMenuList" id="postmenu-${p.id}">${isMine?`<button onclick="editPost(${p.id})">✏️ Editar publicação</button><button onclick="deletePost(${p.id})">🗑️ Apagar publicação</button>${p.profileUpdate?`<button onclick="toggleProfileVisibility(${p.id})">${p.showOnProfile===false?'👁️ Mostrar no perfil':'🙈 Ocultar do perfil'}</button>`:''}`:isWallTarget?`<button onclick="removeWallPost(${p.id})">🗑️ Remover do meu perfil</button><button onclick="removeWallTag(${p.id})">🏷️ Remover marcação</button>`:isTaggedMe?`<button onclick="removeWallTag(${p.id})">🏷️ Remover minha marcação</button>`:'<button onclick="toast(\'Publicação denunciada.\')">⚑ Denunciar</button>'}</div></div></div>${p.text?`<div class="postText">${esc(p.text)}</div>`:''}${p.tagged?.length?`<div>${p.tagged.map(t=>`<span class="tag">@${esc(t)}</span>`).join('')}</div>`:''}${p.media?renderMedia(p.media):''}<div class="postStats"><span class="postLikes">👍 ${likeCount} curtida${likeCount===1?'':'s'}</span>${reactionCount>likeCount?`<span>${reactionCount} reação${reactionCount===1?'':'ões'} no total</span>`:''}</div><div class="actionsRow"><div class="reaction-wrap" onmouseenter="showReactions(${p.id})" onmouseleave="scheduleHideReactions(${p.id})"><button onclick="pickReaction(${p.id},'like')">${p.reaction?reactionMap[p.reaction][0]:'👍'} ${p.reaction?reactionMap[p.reaction][1]:'Curtir'}</button><div id="reactions-${p.id}" class="reaction-picker hidden" onmouseenter="showReactions(${p.id})" onmouseleave="scheduleHideReactions(${p.id})">${Object.entries(reactionMap).map(([k,v])=>`<button title="${v[1]}" onclick="pickReaction(${p.id},'${k}')">${v[0]}</button>`).join('')}</div></div><button onclick="toggleComments(${p.id})">💬 Comentar</button>${p.albumId?`<button onclick="go('photos')">🗂️ Álbum</button>`:''}</div>${p.commentsOpen?renderComments(p):''}</article>`}
function renderMedia(m){if(m.type==='image'||m.type==='gif')return `<div class="postMedia"><img src="${m.src}" alt="Mídia publicada"></div>`;if(m.type==='video')return `<div class="postMedia"><video controls src="${m.src}"></video></div>`;return `<div class="postMedia"><audio controls src="${m.src}"></audio></div>`}
const EMOJIS=['😀','😃','😄','😁','😆','😅','😂','🤣','😊','🙂','🙃','😉','😍','🥰','😘','😎','🤩','🤔','😮','😢','😭','😡','🤬','🤢','😴','🙏','👏','👍','👎','❤️','💜','💙','💚','💛','🖤','🤍','🔥','✨','🎉','🥳','💯','😂','🤣','😇','🤗','😋','😜','🤪','🤓','😱','😬','🙄','😏','💔','💕','💖','💗','💞','🌟','🎈','🎁','🍕','☕','🐶','🐱','🌈'];
function emojiPicker(targetId, pickerId){return `<div class="emojiWrap"><button type="button" class="emojiBtn" title="Emojis" onclick="toggleEmojiPicker('${pickerId}')">😊</button><div id="${pickerId}" class="emojiPicker hidden">${EMOJIS.map(e=>`<button type="button" onclick="insertEmoji('${targetId}','${e}', '${pickerId}')">${e}</button>`).join('')}</div></div>`}
function toggleEmojiPicker(id){document.querySelectorAll('.emojiPicker').forEach(p=>{if(p.id!==id)p.classList.add('hidden')});$(id)?.classList.toggle('hidden')}
function insertEmoji(targetId,emoji,pickerId){const el=$(targetId);if(!el)return;const start=el.selectionStart??el.value.length,end=el.selectionEnd??el.value.length;el.value=el.value.slice(0,start)+emoji+el.value.slice(end);el.focus();const pos=start+emoji.length;el.setSelectionRange?.(pos,pos);$(pickerId)?.classList.add('hidden')}
document.addEventListener('click',e=>{if(!e.target.closest('.emojiWrap'))document.querySelectorAll('.emojiPicker').forEach(p=>p.classList.add('hidden'))});
function selectCommentMedia(input,pid){const f=input.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Comentários aceitam imagens e GIFs.');const reader=new FileReader();reader.onload=()=>{pendingCommentMedia[pid]={type:f.type==='image/gif'||f.name.toLowerCase().endsWith('.gif')?'gif':'image',src:String(reader.result),name:f.name};const box=$('commentMediaPreview-'+pid);if(box){box.classList.remove('hidden');box.innerHTML=renderMedia(pendingCommentMedia[pid])+`<div class="muted">${esc(f.name)}</div>`}};reader.readAsDataURL(f)}
function renderComments(p){return `<div class="commentBox">${(p.comments||[]).map(c=>`<div class="commentItem"><button class="profileNameLink" onclick="viewFriend('${esc(c.owner)}')">${esc(c.owner)}</button>${c.text?`<div>${esc(c.text)}</div>`:''}${c.media?`<div class="commentMedia">${renderMedia(c.media)}</div>`:''}${c.owner===user.name||p.owner===user.name?`<div class="commentActions">${c.owner===user.name?`<button onclick="editComment(${p.id},${c.id})">Editar</button>`:''}<button onclick="deleteComment(${p.id},${c.id})">Excluir</button></div>`:''}</div>`).join('')}<div class="commentForm"><input id="comment-${p.id}" placeholder="Escreva um comentário..." onkeydown="if(event.key==='Enter')addComment(${p.id})">${emojiPicker('comment-'+p.id,'emoji-comment-'+p.id)}<label class="emojiBtn" title="Adicionar imagem ou GIF">🖼️<input type="file" class="hidden" accept="image/*,.gif" onchange="selectCommentMedia(this,${p.id})"></label><button class="btn primary" onclick="addComment(${p.id})">Enviar</button></div><div id="commentMediaPreview-${p.id}" class="commentMediaPreview hidden"></div></div>`}
function showReactions(id){clearTimeout(window.reactionTimers?.[id]);window.reactionTimers=window.reactionTimers||{};$('reactions-'+id)?.classList.remove('hidden')}
function scheduleHideReactions(id){window.reactionTimers=window.reactionTimers||{};window.reactionTimers[id]=setTimeout(()=>{$('reactions-'+id)?.classList.add('hidden')},220)}
function pickReaction(id,r){posts=posts.map(p=>{if(p.id!==id)return p;p.reactions=p.reactions||{};p.reactions[user.name]=p.reactions[user.name]===r?'':r;p.reaction=p.reactions[user.name]||null;return p});save();render();if(r==='love')toast('💜 Amei! 🎉')}
function toggleComments(id){posts=posts.map(p=>p.id===id?{...p,commentsOpen:!p.commentsOpen}:p);save();render()}
function addComment(id){const el=$('comment-'+id),text=el?.value.trim(),media=pendingCommentMedia[id]||null;if(!text&&!media)return;posts=posts.map(p=>p.id===id?{...p,comments:[...(p.comments||[]),{id:Date.now(),owner:user.name,text,media}],commentsOpen:true}:p);delete pendingCommentMedia[id];save();render();toast('Comentário publicado!')}
function editComment(pid,cid){const p=posts.find(x=>x.id===pid),c=p?.comments?.find(x=>x.id===cid);if(!c)return;const t=prompt('Editar comentário:',c.text);if(t===null)return;c.text=t.trim()||c.text;save();render()}
function deleteComment(pid,cid){posts=posts.map(p=>p.id===pid?{...p,comments:(p.comments||[]).filter(c=>c.id!==cid)}:p);save();render();toast('Comentário excluído')}
function togglePostMenu(id){document.querySelectorAll('.postMenu.open').forEach(x=>x.classList.remove('open'));document.getElementById('postmenu-'+id)?.parentElement.classList.toggle('open')}
function editPost(id){const p=posts.find(x=>x.id===id);if(!p||p.owner!==user.name)return;openModal(`<h2>Editar publicação</h2><div class="field"><label>Texto</label><textarea id="editText" rows="5">${attr(p.text)}</textarea></div><div class="field"><label>Privacidade</label><select id="editAudience"><option value="public" ${p.audience==='public'?'selected':''}>🌎 Público</option><option value="friends" ${p.audience==='friends'?'selected':''}>👥 Privado — somente amigos</option></select></div><div class="modalActions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="savePostEdit(${id})">Salvar</button></div>`)}
function savePostEdit(id){const p=posts.find(x=>x.id===id);if(!p)return;p.text=$('editText').value;p.audience=$('editAudience').value;save();closeModal();render();toast('Publicação atualizada')}
function deletePost(id){if(!confirm('Apagar esta publicação?'))return;posts=posts.filter(p=>p.id!==id);save();render();toast('Publicação apagada')}
function toggleProfileVisibility(id){posts=posts.map(p=>p.id===id?{...p,showOnProfile:p.showOnProfile===false}:p);save();render();toast('Visibilidade no perfil atualizada')}
function selectMedia(input,type){const f=input.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{pendingMedia={type:type==='image'?(f.type==='image/gif'?'gif':'image'):type,src:String(reader.result),name:f.name};$('mediaPreview').classList.remove('hidden');$('mediaPreview').innerHTML=renderMedia(pendingMedia)+`<div class="muted" style="margin-top:7px">${esc(f.name)}</div>`};reader.readAsDataURL(f)}
function openTagPicker(){openModal(`<h2>Marcar amigos</h2><div class="tagPicker">${['Daisy','João Pedro','Maria Clara'].map(n=>`<button class="tagFriend ${selectedTags.includes(n)?'selected':''}" onclick="toggleTag('${n}',this)">@${n}</button>`).join('')}</div><div class="modalActions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="closeModal();render()">Concluir</button></div>`)}
function toggleTag(n,b){if(selectedTags.includes(n)){selectedTags=selectedTags.filter(x=>x!==n);b.classList.remove('selected')}else{selectedTags.push(n);b.classList.add('selected')}}
function publish(targetName=''){if(targetName&&!isFriend(targetName))return toast('Você só pode publicar no perfil de um amigo.');const text=$('newPost')?.value.trim()||'';if(!text&&!pendingMedia)return toast('Escreva algo ou adicione uma mídia');const albumId=$('newAlbum')?.value||'';const tagged=[...selectedTags];if(targetName&&!tagged.includes(targetName))tagged.push(targetName);posts.unshift({id:Date.now(),owner:activeIdentity.name,initial:(activeIdentity.name||user.name)[0],text,time:'Agora',audience:$('newAudience').value,media:pendingMedia,tagged,comments:[],reaction:null,albumId:albumId||null,wallTarget:targetName||null});pendingMedia=null;selectedTags=[];save();render();toast(targetName?`Publicação adicionada ao perfil de ${targetName}.`:'Publicação criada!')}
function removeWallPost(id){const p=posts.find(x=>x.id===id);if(!p||p.wallTarget!==user.name)return;posts=posts.filter(x=>x.id!==id);save();render();toast('Publicação removida do seu perfil.')}
function removeWallTag(id){const p=posts.find(x=>x.id===id);if(!p)return;p.tagged=(p.tagged||[]).filter(t=>t!==user.name);if(p.wallTarget===user.name)p.wallTarget=null;save();render();toast('Marcação removida.')}
function photos(){const mediaPosts=posts.filter(p=>p.owner===user.name&&p.media);return layout(`<div class="sectionTitle"><div><h1 style="margin:0">Fotos</h1><div class="muted">Fotos, vídeos e GIFs publicados por você.</div></div><div class="row"><button class="btn soft" onclick="createAlbum()">➕ Criar álbum</button><button class="btn primary" onclick="go('feed')">Nova publicação</button></div></div><div class="card"><h2>Álbuns</h2>${albums.length?`<div class="albumGrid">${albums.map(renderAlbum).join('')}</div>`:'<div class="empty">Você ainda não criou álbuns.</div>'}</div><div class="card"><h2>Todas as mídias</h2>${mediaPosts.length?`<div class="photoGrid">${mediaPosts.map(p=>`<div class="photoTile" title="${esc(p.text||'Publicação')}">${p.media.type==='video'?`<video src="${p.media.src}" muted></video>`:`<img src="${p.media.src}" alt="">`}<span class="tileLabel">${p.media.type==='video'?'🎞️ Vídeo':p.media.type==='gif'?'GIF':'📷 Foto'}</span></div>`).join('')}</div>`:'<div class="empty">Suas fotos, vídeos e GIFs aparecerão aqui.</div>'}</div>`)}
function renderAlbum(a){const p=posts.find(p=>p.albumId===a.id&&p.media);return `<div class="albumCard"><div class="albumCover">${p?`<img src="${p.media.src}" alt="">`:'🗂️'}</div><div class="albumBody"><b>${esc(a.name)}</b><div class="muted">${posts.filter(p=>p.albumId===a.id).length} publicação(ões)</div><div style="margin-top:8px"><span class="privacyBadge">${a.audience==='public'?'🌎 Público':'👥 Somente amigos'}</span></div></div></div>`}
function createAlbum(){openModal(`<h2>Novo álbum</h2><div class="field"><label>Nome do álbum</label><input id="albumName" placeholder="Ex.: Viagens 2026"></div><div class="field"><label>Privacidade</label><select id="albumAudience"><option value="public">🌎 Público</option><option value="friends">👥 Privado — somente amigos</option></select></div><div class="modalActions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAlbum()">Criar álbum</button></div>`)}
function saveAlbum(){const name=$('albumName').value.trim();if(!name)return toast('Digite um nome');albums.push({id:Date.now(),name,audience:$('albumAudience').value});save();closeModal();render();toast('Álbum criado!')}
function viewMyProfile(){profileTarget=null;profileTab='posts';go('profile')}
function viewFriend(name){if(name===user.name){viewMyProfile();return;}profileTarget=name;profileTab='posts';go('profile')}
function isFriend(name){return friendNames.includes(name)&&name!==user.name&&!blockedNames.includes(name)}
function friendRequestCard(r,received=true){return `<div class="friendCard"><div class="row"><button class="profileLinkAvatar miniAvatar" onclick="viewFriend('${esc(r.name)}')">${esc(r.name[0])}</button><div><button class="profileNameLink" onclick="viewFriend('${esc(r.name)}')">${esc(r.name)}</button><div class="muted">${esc(r.username||'@usuario')}</div></div></div>${received?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" onclick="acceptRequest('${esc(r.name)}')">✓ Aceitar</button><button class="btn ghost" onclick="declineRequest('${esc(r.name)}')">Recusar</button></div>`:`<div style="margin-top:10px"><button class="btn ghost" onclick="cancelRequest('${esc(r.name)}')">Cancelar solicitação</button></div>`}</div>`}
function suggestions(){const all=FRIEND_DIRECTORY.filter(p=>p.name!==user.name&&!blockedNames.includes(p.name)&&!friendNames.includes(p.name)&&!friendRequests.some(r=>r.name===p.name)&&!sentRequests.some(r=>r.name===p.name));return all.filter((p,i)=>{const reason=(i%3===0?'Mesmo trabalho':i%3===1?'Mesma cidade':'Amigos em comum');p.reason=reason;return true}).slice(0,6)}
function sendFriendRequest(name){if(friendNames.includes(name)||friendRequests.some(r=>r.name===name)||sentRequests.some(r=>r.name===name))return;const p=[...FRIEND_DIRECTORY,...PAGE_DIRECTORY].find(x=>x.name===name);if(!p)return;sentRequests.push({name:p.name,username:p.username});save();render();toast(`Solicitação enviada para ${name}.`)}
function acceptRequest(name){const r=friendRequests.find(x=>x.name===name);friendRequests=friendRequests.filter(x=>x.name!==name);if(r&&!friendNames.includes(name))friendNames.push(name);save();render();toast(`${name} agora é seu amigo.`)}
function declineRequest(name){friendRequests=friendRequests.filter(x=>x.name!==name);save();render();toast('Solicitação recusada.')}
function cancelRequest(name){sentRequests=sentRequests.filter(x=>x.name!==name);save();render();toast('Solicitação cancelada.')}
function friendsPage(){const sug=suggestions();return layout(`<div class="sectionTitle"><div><h1 style="margin:0">Amigos</h1><div class="muted">Gerencie seus amigos, solicitações e novas conexões.</div></div></div><div class="card"><h2>Solicitações de amizade</h2><p class="muted">Pessoas que enviaram uma solicitação para você.</p>${friendRequests.length?`<div class="friendGrid">${friendRequests.map(r=>friendRequestCard(r,true)).join('')}</div>`:'<div class="empty">Nenhuma solicitação recebida.</div>'}<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">Solicitações enviadas (${sentRequests.length})</summary><div style="margin-top:12px">${sentRequests.length?`<div class="friendGrid">${sentRequests.map(r=>friendRequestCard(r,false)).join('')}</div>`:'<div class="empty">Você não tem solicitações enviadas.</div>'}</div></details></div><div class="card"><h2>Pessoas que você talvez conheça</h2><p class="muted">Sugestões baseadas em trabalho, cidade, amigos em comum e outros pontos de conexão.</p>${sug.length?`<div class="friendGrid">${sug.map(p=>`<div class="friendCard"><div class="row"><button class="profileLinkAvatar miniAvatar" onclick="viewFriend('${esc(p.name)}')">${esc(p.name[0])}</button><div><button class="profileNameLink" onclick="viewFriend('${esc(p.name)}')">${esc(p.name)}</button><div class="muted">${esc(p.username)}</div><div class="muted small">${esc(p.reason)} · possível conexão</div></div></div><button class="btn primary" style="margin-top:10px" onclick="sendFriendRequest('${esc(p.name)}')">➕ Adicionar amigo</button></div>`).join('')}</div>`:'<div class="empty">Não há novas sugestões no momento.</div>'}</div><div class="card"><h2>Seus amigos</h2><div class="friendGrid">${friendNames.filter(n=>!blockedNames.includes(n)).map(n=>`<div class="friendCard"><div class="row"><button class="profileLinkAvatar miniAvatar" onclick="viewFriend('${esc(n)}')">${esc(n[0])}</button><div><button class="profileNameLink" onclick="viewFriend('${esc(n)}')">${esc(n)}</button><div class="muted">Amigo</div></div></div><button class="btn soft" onclick="viewFriend('${esc(n)}')">Ver perfil</button><button class="btn ghost" onclick="openChatWith('${esc(n)}')">💬 Conversar</button></div>`).join('')}</div></div>`)}
function friendProfileActions(name){if(!isFriend(name))return '';return `<div class="profileActions"><button class="btn ghost" onclick="openChatWith('${esc(name)}')">💬 Mensagem</button><button class="btn ghost" onclick="removeFriend('${esc(name)}')">👥 Remover amizade</button><button class="btn danger" onclick="blockFriend('${esc(name)}')">🚫 Bloquear</button></div>`}
function removeFriend(name){if(!isFriend(name))return;const i=friendNames.indexOf(name);if(i>=0)friendNames.splice(i,1);profileTarget=null;render();toast(`${name} foi removido dos amigos.`)}
function blockFriend(name){if(!isFriend(name))return;const i=friendNames.indexOf(name);if(i>=0)friendNames.splice(i,1);if(!blockedNames.includes(name))blockedNames.push(name);save();profileTarget=null;render();toast(`${name} foi bloqueado.`)}
function unblockFriend(name){if(!blockedNames.includes(name))return;blockedNames=blockedNames.filter(n=>n!==name);if(!friendNames.includes(name))friendNames.push(name);save();render();toast(`${name} foi desbloqueado.`)}
function chatDisplayName(name){return chatNicknames[name]||name}
function ensureReceivedNickname(name){if(!receivedNicknames[name]){receivedNicknames[name]=user.name.split(' ')[0];save();}return receivedNicknames[name]}
function chatNicknameInfo(name){const mine=chatNicknames[name], theirs=receivedNicknames[name]||ensureReceivedNickname(name);return `${mine?`Você chama ${esc(name)} de <b>${esc(mine)}</b>`:`Você ainda não deu apelido para ${esc(name)}`} · ${esc(name)} chama você de <b>${esc(theirs)}</b>`}
function chatMediaHtml(m){if(!m)return '';if(m.type==='image'||m.type==='gif')return `<div class=\"chatBubbleMedia\"><img src=\"${m.src}\" alt=\"Mídia\"></div>`;if(m.type==='video')return `<div class=\"chatBubbleMedia\"><video controls src=\"${m.src}\"></video></div>`;return `<div class=\"chatBubbleMedia\"><audio controls src=\"${m.src}\"></audio></div>`}
function toggleTopChatMenu(){topChatOpen=!topChatOpen;render()}
function recentChats(){return friendNames.filter(n=>!blockedNames.includes(n)).map(name=>({name,msg:(chatMessages[name]||[]).slice(-1)[0]})).filter(x=>x.msg).sort((a,b)=>(b.msg?.id||0)-(a.msg?.id||0))}
function topChatMenu(){const recent=recentChats();return `<div class="topChatMenu" onclick="event.stopPropagation()"><div class="topChatMenuHead"><b>Conversas recentes</b><button class="btn ghost" style="padding:6px 9px" onclick="clearAllChatHistory()">Zerar todas</button></div>${recent.length?recent.map(x=>{const m=x.msg||{};const preview=m.media?({image:'📷 Foto',gif:'🎞️ GIF',video:'🎬 Vídeo',audio:'🎙️ Áudio'}[m.media.type]||'📎 Mídia'):(m.text||'');return `<div class="topChatConversation"><button class="topChatConversation" style="padding:0" onclick="openChatWith('${esc(x.name)}')"><div class="miniAvatar">${esc(x.name[0])}</div><div class="topChatMain"><b>${esc(chatDisplayName(x.name))}</b><div class="topChatPreview">${m.me?'Você: ':''}${esc(preview)}</div></div><span class="topChatTime">${unreadChatFor(x.name)?`<span class="unreadBadge">${unreadChatFor(x.name)>99?'99+':unreadChatFor(x.name)}</span>`:(m.me&&m.status==='seen'?'✓✓':' ')}</span></button><button class="topChatClear" title="Apagar histórico" onclick="clearChatHistory('${esc(x.name)}')">🗑️</button></div>`}).join(''):`<div class="topChatEmpty">Nenhuma conversa recente.</div>`}</div>`}
function clearChatHistory(name){if(!chatMessages[name]?.length)return; if(!confirm(`Apagar todo o histórico com ${name}?`))return;chatMessages[name]=[];save();if(chatState.friend===name)chatState={open:false,minimized:false,friend:null};topChatOpen=true;render();toast(`Histórico com ${name} apagado.`)}
function clearAllChatHistory(){const recent=recentChats();if(!recent.length){toast('Não há históricos para apagar.');return}if(!confirm('Apagar todo o histórico de todas as conversas?'))return;Object.keys(chatMessages).forEach(k=>chatMessages[k]=[]);save();if(chatState.open)chatState={open:false,minimized:false,friend:null};topChatOpen=true;render();toast('Todos os históricos de conversa foram zerados.')}
function chatWidget(){if(!requireAuth())return '';if(!chatState.open)return `<div class="chatDock"><div class="chatLauncherWrap"><button class="chatLauncher" onclick="openChatChooser()" title="Abrir bate-papo">💬</button>${chatUnreadBadge()}</div></div>`;const friend=chatState.friend;let panel='';if(!friend){panel=`<div class="chatPanel"><div class="chatHead"><span class="chatTitle">Bate-papo</span><div class="chatTools"><button onclick="closeChat()" title="Fechar">✕</button></div></div><div class="chatFriendList">${friendNames.filter(n=>!blockedNames.includes(n)).map(n=>`<button class="chatFriend" onclick="openChatWith('${esc(n)}')">${contactAvatarHtml(n,'chatFriendAvatar',true)}<div style="min-width:0;flex:1"><b>${esc(chatDisplayName(n))}</b><div class="muted">${chatNicknames[n]?`@${esc(n)}`:'Conversando com você'}</div>${presenceLine(n)}</div></button>`).join('')}</div></div>`;}else if(chatState.minimized){panel=`<div class="chatPanel"><div class="chatHead"><div class="chatHeaderPerson">${contactAvatarHtml(friend,'chatHeaderAvatar',true)}<div><button class="profileNameLink chatProfileClick" onclick="event.stopPropagation();viewFriend('${esc(friend)}')">💬 ${esc(chatDisplayName(friend))}</button>${presenceLine(friend)}</div></div><div class="chatTools"><button onclick="toggleChatMin()" title="Maximizar">□</button><button onclick="closeChat()" title="Fechar">✕</button></div></div></div>`;}else{const msgs=chatMessages[friend]||[];panel=`<div class="chatPanel"><div class="chatHead"><div class="chatHeaderPerson">${contactAvatarHtml(friend,'chatHeaderAvatar',true)}<div><button class="profileNameLink chatProfileClick" onclick="event.stopPropagation();viewFriend('${esc(friend)}')">${esc(chatDisplayName(friend))}</button><div class="chatNick">${chatNicknames[friend]?`Apelido: ${esc(chatNicknames[friend])}`:`Conversando com ${esc(friend)}`}</div>${presenceLine(friend)}</div></div><div class="chatTools"><button onclick="renameChatFriend()" title="Mudar apelido">✏️</button><button onclick="openChatChooser()" title="Escolher amigo">↔</button><button onclick="toggleChatMin()" title="Minimizar">−</button><button onclick="closeChat()" title="Fechar">✕</button></div></div><div class="chatBody"><div class="chatMessages">${msgs.length?msgs.map(m=>`<div class="chatMsgRow ${m.me?'me':'them'}">${m.me?avatarHtml('chatMsgAvatar'):contactAvatarHtml(friend,'chatMsgAvatar',false)}<div class="chatMsgContent"><div class="chatBubble ${m.me?'me':'them'} ${m.media?'hasMedia':''}">${m.media?chatMediaHtml(m.media):esc(m.text||'')}${m.me?`<div class="chatStatus ${m.status==='seen'?'seen':'received'}">${m.status==='seen'?'✓✓':'✓'}</div>`:''}</div></div></div>`).join(''):`<div class="chatEmpty">Comece uma conversa com ${esc(chatDisplayName(friend))}.<br><small>Mensagens privadas desta conversa aparecerão aqui.</small></div>`}</div><div class="chatInput"><div class="chatComposerTools"><label class="chatMediaBtn" title="Foto ou vídeo">📷<input type="file" class="hidden" accept="image/*,video/*" capture="environment" onchange="sendChatMedia(this)"></label><button class="chatMediaBtn mic" onclick="toggleChatAudio()" title="Gravar áudio">${chatRecording?'⏹️':'🎙️'}</button></div>${emojiPicker('chatInput','emoji-chat')}<input id="chatInput" placeholder="Digite uma mensagem..." onkeydown="if(event.key==='Enter')sendChat()"><button class="btn primary" onclick="sendChat()">Enviar</button></div></div></div>`;}return `<div class="chatDock">${panel}</div>`}
function openChatChooser(){chatState.open=true;chatState.minimized=false;chatState.friend=null;render()}
function openChatWith(name){if(!isFriend(name))return;ensureReceivedNickname(name);markChatRead(name);chatState={open:true,minimized:false,friend:name};render();setTimeout(()=>$('chatInput')?.focus(),30)}
function toggleChatMin(){chatState.minimized=!chatState.minimized;render()}
function closeChat(){if(chatRecording?.stream)chatRecording.stream.getTracks().forEach(t=>t.stop());chatRecording=null;chatState={open:false,minimized:false,friend:null};render()}
function renameChatFriend(){const friend=chatState.friend;if(!friend)return;const old=chatNicknames[friend]||'';const n=prompt(`Apelido para ${friend}:`,old);if(n===null)return;const clean=n.trim();if(clean)chatNicknames[friend]=clean;else delete chatNicknames[friend];save();render();toast(clean?`Apelido alterado para ${clean}.`:'Apelido removido.')}
function changeReceivedNickname(){const friend=chatState.friend;if(!friend)return;const current=ensureReceivedNickname(friend);const n=prompt(`${friend} usa qual apelido para você?`,current);if(n===null)return;const clean=n.trim();if(clean)receivedNicknames[friend]=clean;else delete receivedNicknames[friend];save();render();toast(clean?`${friend} agora chama você de ${clean}.`:'Apelido que a pessoa usa para você removido.')}
function sendChat(){const el=$('chatInput'),text=el?.value.trim(),friend=chatState.friend;if(!text||!friend)return;const msg={id:Date.now(),me:true,text,status:'received'};chatMessages[friend]=[...(chatMessages[friend]||[]),msg];save();render();setTimeout(()=>{const arr=chatMessages[friend]||[];const m=arr.find(x=>x.id===msg.id);if(m){m.status='seen';save();if(chatState.friend===friend)render()}},650);}
function sendChatMedia(input){const f=input.files?.[0],friend=chatState.friend;if(!f||!friend)return;const type=f.type.startsWith('video')?'video':f.type.startsWith('image')?(f.type==='image/gif'?'gif':'image'):'audio';const reader=new FileReader();reader.onload=()=>{const msg={id:Date.now(),me:true,media:{type,src:String(reader.result)},status:'received'};chatMessages[friend]=[...(chatMessages[friend]||[]),msg];save();render();setTimeout(()=>{const m=(chatMessages[friend]||[]).find(x=>x.id===msg.id);if(m){m.status='seen';save();if(chatState.friend===friend)render()}},650);};reader.readAsDataURL(f)}
async function toggleChatAudio(){const friend=chatState.friend;if(!friend)return;if(chatRecording){chatRecording.recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){const inp=document.createElement('input');inp.type='file';inp.accept='audio/*';inp.onchange=()=>sendChatMedia(inp);inp.click();toast('Seu navegador não permite gravação direta; selecione um áudio.');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/ogg';const recorder=new MediaRecorder(stream,{mimeType:mime});const chunks=[];chatRecording={recorder,stream};recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());chatRecording=null;const blob=new Blob(chunks,{type:mime});const reader=new FileReader();reader.onload=()=>{const msg={id:Date.now(),me:true,media:{type:'audio',src:String(reader.result)},status:'received'};chatMessages[friend]=[...(chatMessages[friend]||[]),msg];save();render();setTimeout(()=>{const m=(chatMessages[friend]||[]).find(x=>x.id===msg.id);if(m){m.status='seen';save();if(chatState.friend===friend)render()}},650);};reader.readAsDataURL(blob)};recorder.start();render();toast('Gravando áudio… clique no microfone novamente para enviar.')}catch(e){toast('Não foi possível acessar o microfone. Selecione um áudio pelo botão de áudio.')}}
function setProfileTab(tab){profileTab=tab;render()}
function socialHref(network,value){if(!value)return '';let v=value.trim();if(/^https?:\/\//i.test(v))return v;v=v.replace(/^@/,'');const bases={instagram:'https://instagram.com/',tiktok:'https://www.tiktok.com/@',facebook:'https://facebook.com/'};return bases[network]+v}
function familySection(){return `<div class="card"><div class="sectionTitle"><div><h2 style="margin:0">Família</h2><div class="muted">Somente a quantidade adicionada fica visível no perfil.</div></div><button class="btn soft" onclick="addFamilyMember()">➕ Adicionar</button></div>${familyMembers.length?`<div class="familyGrid">${familyMembers.map((m,i)=>`<div class="familyCard"><b>${esc(m.name)}</b><div class="muted">${esc(m.relation)}</div>${m.profile?`<button class="profileNameLink" onclick="viewProfileRef('${esc(m.profile)}')">@${esc(m.profile)}</button>`:`<div class="muted">Sem perfil no OnlyUs.</div>`}<button class="btn ghost" style="width:100%;margin-top:8px" onclick="removeFamilyMember(${i})">Remover</button></div>`).join('')}</div>`:`<div class="empty" style="padding:20px">Nenhum familiar adicionado.</div>`}</div>`}
function addFamilyMember(){openModal(`<h2>Adicionar familiar</h2><div class="field"><label>Nome</label><input id="famName" placeholder="Nome do familiar"></div><div class="field"><label>Parentesco</label><select id="famRel"><option>mãe</option><option>pai</option><option>filho(a)</option><option>irmão(ã)</option><option>avô/avó</option><option>neto(a)</option><option>tio(a)</option><option>primo(a)</option><option>cônjuge</option><option>companheiro(a)</option><option>outro</option></select></div><div class="field"><label>Perfil no OnlyUs (opcional)</label><input id="famProfile" placeholder="@usuario ou nome"></div><div class="modalActions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveFamilyMember()">Adicionar</button></div>`)}
function saveFamilyMember(){const name=$('famName').value.trim(),relation=$('famRel').value,profile=$('famProfile').value.trim().replace(/^@/,'');if(!name)return toast('Informe o nome.');familyMembers.push({name,relation,profile});save();closeModal();render();toast('Familiar adicionado!')}
function removeFamilyMember(i){familyMembers.splice(i,1);save();render()}
function petsSection(){return `<div class="card"><div class="sectionTitle"><div><h2 style="margin:0">🐾 Animais de estimação</h2><div class="muted">Escolha quais animais fazem parte do seu perfil.</div></div><button class="btn soft" onclick="addPet()">➕ Adicionar</button></div>${pets.length?`<div class="tagPicker">${pets.map((p,i)=>`<span class="tag">${esc(p.type)} · ${esc(p.name)} <button style="background:none;color:inherit" onclick="removePet(${i})">×</button></span>`).join('')}</div>`:`<div class="empty" style="padding:20px">Nenhum animal adicionado.</div>`}</div>`}
function addPet(){openModal(`<h2>Adicionar animal</h2><div class="field"><label>Nome</label><input id="petName" placeholder="Nome do animal"></div><div class="field"><label>Tipo</label><select id="petType"><option>🐶 Cachorro</option><option>🐱 Gato</option><option>🐦 Ave</option><option>🐰 Coelho</option><option>🐹 Roedor</option><option>🐢 Réptil</option><option>🐴 Cavalo</option><option>Outro</option></select></div><div class="modalActions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="savePet()">Adicionar</button></div>`)}
function savePet(){const name=$('petName').value.trim();if(!name)return toast('Informe o nome.');pets.push({name,type:$('petType').value});save();closeModal();render();toast('Animal adicionado!')}
function removePet(i){pets.splice(i,1);save();render()}
function profileAbout(name,own){const links=own?Object.entries(socialLinks).filter(([,v])=>v):[];const isPage=isPageName(name);const rel=own?user.relationship||'Não informado':isPage?'Página':'Amigo';const relMatch=String(rel).match(/^(.+?)\s*[—-]\s*(.+)$/);const relPerson=relMatch?profileDirectoryEntry(relMatch[1].trim()):null;return `<div><div class="card"><h2>Sobre</h2><p>❤️ Relacionamento: <b>${relPerson?`<button class="profileNameLink" onclick="viewProfileRef('${esc(relPerson.username)}')">${esc(relPerson.name)}</button> — ${esc(relMatch[2])}`:esc(rel)}</b></p><p>🏠 Cidade: <b>${esc(own?user.city||'Não informada':'Não informado')}</b></p><p>💼 Trabalho: <b>${esc(own?user.work||'Não informado':'Não informado')}</b></p>${!own?presenceLine(name):''}${own&&links.length?`<h3>Redes sociais</h3><div class="socialLinks">${links.map(([k,v])=>`<a class="socialLink" href="${esc(socialHref(k,v))}" target="_blank" rel="noopener">${k} ${esc(v)}</a>`).join('')}</div>`:''}</div>${own?familySection()+petsSection():''}</div>`}
function profileMarked(name){const marked=posts.filter(p=>canSeePost(p)&&(p.owner===name||((p.tagged||[]).includes(name))));return `<div style="max-width:700px;margin:16px auto">${marked.length?marked.map(renderPost).join(''):`<div class="card empty"><h2>Nenhuma publicação marcada</h2><p class="muted">Publicações em que ${esc(name)} foi marcado aparecerão aqui.</p></div>`}</div>`}

function positionCrop(){const vp=$('cropViewport'),img=$('cropImage');if(!vp||!img)return;const base=Math.max(vp.clientWidth/img.naturalWidth,vp.clientHeight/img.naturalHeight);const scale=base*cropState.zoom;const w=img.naturalWidth*scale,h=img.naturalHeight*scale;img.style.width=w+'px';img.style.height=h+'px';img.style.left=((vp.clientWidth-w)/2+cropState.x)+'px';img.style.top=((vp.clientHeight-h)/2+cropState.y)+'px'}

async function loginGo(){
  if(supabaseAuthBusy)return;
  const email=$('loginEmail').value.trim().toLowerCase(),p=$('loginPass').value;
  if(!email||!p)return toast('Informe e-mail e senha.');
  supabaseAuthBusy=true;
  try{
    const {data,error}=await supabase.auth.signInWithPassword({email,password:p});
    if(error)throw error;
    await hydrateFromSupabase(data.user);
    sessionStorage.setItem('onlyus-session','1');route='feed';location.hash='feed';render();toast('Login realizado!');
  }catch(e){toast(authErrorMessage(e));}
  finally{supabaseAuthBusy=false;}
}
async function createAccount(){
  if(supabaseAuthBusy)return;
  const name=$('regName').value.trim(),username=$('regUser').value.trim().toLowerCase().replace(/^@/,'').replace(/\s+/g,''),email=$('regEmail').value.trim().toLowerCase(),p=$('regPass').value,p2=$('regPass2').value;
  if(!name||!username||!email||!p)return toast('Preencha todos os campos.');
  if(!/^[a-z0-9._-]{3,30}$/.test(username))return toast('Nome de usuário: use 3–30 caracteres, letras, números, ponto, hífen ou _.');
  if(p.length<6)return toast('A senha precisa ter pelo menos 6 caracteres.');
  if(p!==p2)return toast('As senhas não coincidem.');
  supabaseAuthBusy=true;
  try{
    const {data,error}=await supabase.auth.signUp({email,password:p,options:{emailRedirectTo:'https://stavo-9.github.io/OnlyUs/',data:{name,username}}});
    if(error)throw error;
    if(data.user){
      user={...defaultUser,name,username};
      account={name,username};
      localStorage.setItem(STORAGE.account,JSON.stringify(account));
      save();
    }
    if(data.session){
      await hydrateFromSupabase(data.user);sessionStorage.setItem('onlyus-session','1');route='feed';location.hash='feed';render();toast('Conta criada e login realizado!');
    }else{
      route='login';location.hash='login';render();toast('Conta criada! Verifique seu e-mail para confirmar e entrar.');
    }
  }catch(e){toast(authErrorMessage(e));}
  finally{supabaseAuthBusy=false;}
}
async function resetPassword(){
  const email=prompt('Digite o e-mail da sua conta OnlyUs:')?.trim().toLowerCase();
  if(!email)return;
  const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:'https://stavo-9.github.io/OnlyUs/'});
  if(error)return toast(authErrorMessage(error));
  toast('Enviamos um link para redefinir sua senha.');
}
function authErrorMessage(e){
  const m=String(e?.message||e||'Erro de autenticação');
  if(/invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/email not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar.';
  if(/user already registered/i.test(m))return 'Este e-mail já possui uma conta.';
  if(/password should be at least/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde um pouco e tente novamente.';
  return m;
}
async function hydrateFromSupabase(authUser){
  if(!authUser)return;
  supabaseUser=authUser;
  const meta=authUser.user_metadata||{};
  let profile=null;
  try{
    const {data,error}=await supabase.from('profiles').select('*').eq('id',authUser.id).maybeSingle();
    if(error)throw error;
    profile=data;
  }catch(e){console.warn('OnlyUs profile read:',e);}
  const merged={...defaultUser,...user,...(profile||{}),name:profile?.name||meta.name||user.name||'Usuário OnlyUs',username:profile?.username||meta.username||user.username||authUser.email?.split('@')[0]||'usuario'};
  user=merged;
  account={name:user.name,username:user.username};
  localStorage.setItem(STORAGE.account,JSON.stringify(account));
  save();
  try{
    await supabase.from('profiles').upsert({id:authUser.id,name:user.name,username:user.username},{onConflict:'id'});
  }catch(e){console.warn('OnlyUs profile sync:',e);}
}

function closeModal(){$('modalRoot').innerHTML='';pendingCrop=null}
let searchQuery='';
function allSearchEntries(){return [...FRIEND_DIRECTORY,...PAGE_DIRECTORY,...pages.map(p=>({name:p.name,username:p.username,bio:p.bio||'Página criada por você.',isPage:true}))]}
function searchDirectory(q=''){searchQuery=q;const term=q.trim().toLowerCase().replace(/^@/,'');return allSearchEntries().filter(p=>!blockedNames.includes(p.name)&&(!term||p.name.toLowerCase().includes(term)||p.username.toLowerCase().replace(/^@/,'').includes(term)));}
function addFriendFromSearch(name){if(name===user.name||blockedNames.includes(name)||friendNames.includes(name))return;if(friendRequests.some(r=>r.name===name)||sentRequests.some(r=>r.name===name))return;const p=allSearchEntries().find(x=>x.name===name);if(!p||p.isPage)return sendFriendRequest(name);sendFriendRequest(name)}
function searchPage(){const results=searchDirectory(searchQuery);return layout(`<div class="sectionTitle"><div><h1 style="margin:0">🔎 Pesquisa</h1><div class="muted">Encontre pessoas e páginas pelo nome ou @nome de usuário.</div></div></div><div class="card searchCard"><div class="searchLarge"><span>🔎</span><input id="peopleSearch" value="${attr(searchQuery)}" placeholder="Digite um nome ou @nome de usuário" oninput="searchQuery=this.value;renderSearchResults()" autofocus></div><div id="searchResults">${renderSearchResultsHtml(results)}</div></div>`)}
function renderSearchResultsHtml(results){if(!results.length)return `<div class="empty"><h3>Nenhum resultado encontrado</h3><p class="muted">Tente outro nome ou @nome de usuário.</p></div>`;return `<div class="searchPeopleList">${results.map(p=>{const friend=isFriend(p.name);const page=!!p.isPage;const pending=sentRequests.some(r=>r.name===p.name);return `<div class="searchPerson"><button class="profileLinkAvatar miniAvatar" onclick="viewFriend('${esc(p.name)}')">${esc(p.name[0])}</button><div class="searchPersonInfo"><button class="profileNameLink" onclick="viewFriend('${esc(p.name)}')">${esc(p.name)}</button><div class="muted">${esc(p.username)} ${page?'· Página':''}${page?` · ${pageFollowerCount(p.name)} seguidores`:''}</div><div class="muted small">${esc(p.bio||'')}</div></div><div>${page?`<span class="badge">📄 Página</span>`:friend?`<span class="badge">👥 Amigos</span>`:pending?`<span class="badge">⏳ Solicitação enviada</span>`:`<button class="btn primary" onclick="addFriendFromSearch('${esc(p.name)}')">➕ Adicionar amigo</button>`}</div></div>`}).join('')}</div>`}
function renderSearchResults(){const box=$('searchResults');if(!box)return;box.innerHTML=renderSearchResultsHtml(searchDirectory(searchQuery));const inp=$('peopleSearch');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}
function createPage(){openModal(`<h2>Criar página</h2><div class="field"><label>Nome da página</label><input id="pageName" placeholder="Ex.: Minha Empresa"></div><div class="field"><label>@nome de usuário</label><input id="pageUser" placeholder="@minhaempresa"></div><div class="field"><label>Descrição</label><textarea id="pageBio" placeholder="Sobre esta página"></textarea></div><div class="modalActions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="savePage()">Criar página</button></div>`)}
function savePage(){const name=$('pageName').value.trim(),username=($('pageUser').value.trim().replace(/^@/,'').replace(/\s+/g,'').toLowerCase()),bio=$('pageBio').value.trim();if(!name||!username)return toast('Informe o nome e o @nome de usuário.');if(allSearchEntries().some(p=>p.username.replace(/^@/,'').toLowerCase()===username))return toast('Esse nome de usuário já está em uso.');pages.push({id:Date.now(),name,username:'@'+username,bio,avatar:'',followers:[]});save();closeModal();render();toast('Página criada!')}
function switchIdentity(){const identities=[{type:'user',name:user.name,username:'@'+user.username},...pages.map(p=>({type:'page',name:p.name,username:p.username,id:p.id}))];openModal(`<h2>Alterar usuário/página</h2><p class="muted">Escolha em qual identidade você está usando o OnlyUs. para publicar.</p><div class="identityList">${identities.map(i=>`<button class="friendCard" style="text-align:left;border:1px solid var(--line);background:var(--card)" onclick="setIdentity('${i.type}','${esc(i.name)}','${esc(i.username)}','${i.id||''}')"><b>${i.type==='page'?'📄':'👤'} ${esc(i.name)}</b><div class="muted">${esc(i.username)} ${activeIdentity.name===i.name?' · ativo':''}</div></button>`).join('')}</div>`)}
function setIdentity(type,name,username,id=''){activeIdentity={type,name,username,id:id||undefined};save();closeModal();render();toast(`Agora você está usando ${name}.`)}
const UI_TRANSLATIONS={
'English':{'Início':'Home','🏠 Início':'🏠 Home','👥 Amigos':'👥 Friends','Amigos':'Friends','Solicitações':'Requests','🤝 Solicitações':'🤝 Requests','Configurações':'Settings','⚙️ Configurações':'⚙️ Settings','Fotos':'Photos','Sobre':'About','Marcados':'Tagged','Publicações':'Posts','Editar perfil':'Edit profile','Abrir meu perfil':'Open my profile','Ver perfil':'View profile','Conversar':'Chat','Mensagem':'Message','Remover amizade':'Remove friend','Bloquear':'Block','Desbloquear':'Unblock','Pessoas bloqueadas':'Blocked people','Salvar alterações':'Save changes','Cancelar':'Cancel','Idioma':'Language','Modo escuro':'Dark mode','Fazer logout':'Log out','Publicar':'Postar','Curtir':'Like','Comentar':'Comment','Enviar':'Send','Nenhuma publicação marcada':'No tagged posts','Nenhuma publicação visível no perfil.':'No visible posts on this profile.','Nenhuma publicação de':'No posts by','Toda foto, vídeo ou GIF publicado por você fica nesta área.':'All photos, videos or GIFs you post appear here.','Abrir Fotos e álbuns':'Open Photos and albums','Você não tem pessoas bloqueadas.':'You have no blocked people.','Bloqueado':'Blocked','Pesquisa':'Search'},
'Español':{'Início':'Inicio','Amigos':'Amigos','Solicitações':'Solicitudes','Configurações':'Configuración','Fotos':'Fotos','Sobre':'Acerca de','Marcados':'Etiquetados','Publicações':'Publicaciones','Editar perfil':'Editar perfil','Abrir meu perfil':'Abrir mi perfil','Ver perfil':'Ver perfil','Conversar':'Chatear','Mensagem':'Mensaje','Remover amizade':'Eliminar amigo','Bloquear':'Bloquear','Desbloquear':'Desbloquear','Pessoas bloqueadas':'Personas bloqueadas','Salvar alterações':'Guardar cambios','Cancelar':'Cancelar','Idioma':'Idioma','Modo escuro':'Modo oscuro','Fazer logout':'Cerrar sesión','Publicar':'Publicar','Curtir':'Me gusta','Comentar':'Comentar','Enviar':'Enviar','Nenhuma publicação marcada':'No hay publicaciones etiquetadas','Nenhuma publicação visível no perfil.':'No hay publicaciones visibles en el perfil.','Toda foto, vídeo ou GIF publicado por você fica nesta área.':'Aquí aparecen tus fotos, videos o GIFs.','Abrir Fotos e álbuns':'Abrir Fotos y álbumes','Você não tem pessoas bloqueadas.':'No tienes personas bloqueadas.','Bloqueado':'Bloqueado'}
};
function applyLanguage(){const dict=UI_TRANSLATIONS[user.language];if(!dict)return;document.querySelectorAll('#app button,#app h1,#app h2,#app h3,#app label,#app p,#app .muted,#app .empty').forEach(el=>{const t=el.textContent.trim();if(dict[t])el.textContent=el.textContent.replace(t,dict[t])});document.querySelectorAll('#app input[placeholder]').forEach(el=>{const t=el.placeholder;if(user.language==='English'){if(t==='O que você quer compartilhar?')el.placeholder='What do you want to share?';if(t==='Escreva um comentário...')el.placeholder='Write a comment...';if(t==='Digite uma mensagem...')el.placeholder='Type a message...'}else if(user.language==='Español'){if(t==='O que você quer compartilhar?')el.placeholder='¿Qué quieres compartir?';if(t==='Escreva um comentário...')el.placeholder='Escribe un comentario...';if(t==='Digite uma mensagem...')el.placeholder='Escribe un mensaje...'}})}
function render(){applyTheme();applyViewMode();if(!requireAuth()&&route!=='login'&&route!=='register')route='login';let c=route==='login'?login():route==='register'?register():route==='feed'?feed():route==='profile'?profile():route==='photos'?photos():route==='settings'?settings():route==='friends'?friendsPage():route==='requests'?friendsPage():route==='chat'?simple('💬 Chat','Suas conversas do OnlyUs aparecerão aqui.'):route==='notifications'?feed():route==='search'?searchPage():feed();$('app').innerHTML=c;applyLanguage()}
window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'feed';if(!requireAuth()&&route!=='login'&&route!=='register')route='login';render()});
async function initSupabaseAuth(){
  try{
    const {data}=await supabase.auth.getSession();
    if(data.session?.user){
      await hydrateFromSupabase(data.session.user);
      supabaseUser=data.session.user;
      sessionStorage.setItem('onlyus-session','1');
      route=location.hash.slice(1)||'feed';
    }else{
      supabaseUser=null;sessionStorage.removeItem('onlyus-session');route=location.hash.slice(1)||'login';
    }
  }catch(e){console.error('OnlyUs Auth:',e);route='login';}
  supabaseReady=true;
  if(!requireAuth()&&route!=='login'&&route!=='register')route='login';
  render();
  supabase.auth.onAuthStateChange(async(event,session)=>{
    if(session?.user){
      supabaseUser=session.user;sessionStorage.setItem('onlyus-session','1');
      if(event==='SIGNED_IN')await hydrateFromSupabase(session.user);
      if(route==='login'||route==='register'){route='feed';location.hash='feed';render();}
    }else{
      supabaseUser=null;sessionStorage.removeItem('onlyus-session');
      if(route!=='login'&&route!=='register'){route='login';location.hash='login';render();}
    }
  });
}
route=location.hash.slice(1)||'login';
render();
initSupabaseAuth();
</script>
